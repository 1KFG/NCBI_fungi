[workspace]
name = "ncbi-fungi"
version = "0.1.0"
description = "Download and summarize NCBI fungal genome assemblies"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.15.1,<3.16"
biopython = ">=1.88,<2"
gffutils = ">=0.14,<0.15"
ncbi-datasets-cli = ">=18.39.0,<19"
taxonkit = ">=0.20.0,<0.21"
parallel = ">=20260922,<20260923"
perl = ">=5.44.0,<5.45"
rsync = ">=3.4.4,<4"
make = ">=4.4.1,<5"
curl = ">=8.23.0,<9"
htslib = ">=1.24,<2"
samtools = ">=1.24,<2"
aria2 = ">=1.37.0,<2"
matplotlib = ">=3.11.2,<4"

[tasks]
# Convenience wrappers around the Makefile
init = "make init"
download = "make download"
stats = "make stats"
gffdb = "make gffdb"
genomes = "make genomes"
