[workspace]
name = "ncbi-fungi"
version = "0.1.0"
description = "Download and summarize NCBI fungal genome assemblies"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.14.4,<3.15"
biopython = ">=1.87,<2"
gffutils = ">=0.14,<0.15"
ncbi-datasets-cli = ">=18.24.0,<19"
taxonkit = ">=0.20.0,<0.21"
parallel = ">=20260422,<20260423"
perl = ">=5.32.1,<5.33"
rsync = ">=3.4.1,<4"
make = ">=4.4.1,<5"
curl = ">=8.19.0,<9"
htslib = ">=1.23.1,<2"
samtools = ">=1.23.1,<2"
aria2 = ">=1.37.0,<2"
matplotlib = ">=3.10,<4"

[tasks]
# Convenience wrappers around the Makefile
init = "make init"
download = "make download"
stats = "make stats"
gffdb = "make gffdb"
genomes = "make genomes"
